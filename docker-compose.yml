services:
  postgres:
    image: postgres:16-alpine
    container_name: arise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-arise}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arise"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - arise-network

  redis:
    image: redis:7-alpine
    container_name: arise-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - arise-network

volumes:
  postgres_data:
  redis_data:

networks:
  arise-network:
    driver: bridge
