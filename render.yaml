services:
  - type: web
    name: arise-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
