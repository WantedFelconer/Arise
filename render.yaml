services:
  # ---------------------------------------------------------------------------
  # 1. ARISE Backend (NestJS Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: arise-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*" # Or set to your frontend Render URL, e.g. https://arise-web.onrender.com
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        sync: false # Paste your Supabase DATABASE_URL in Render Dashboard
      - key: DIRECT_URL
        sync: false # Paste your Supabase DIRECT_URL in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 30d
      - key: REDIS_URL
        value: redis://localhost:6379

  # ---------------------------------------------------------------------------
  # 2. ARISE Web Frontend (React 19 / Vite Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: arise-web
    runtime: static
    rootDir: client_web
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://arise-backend.onrender.com/api/v1
